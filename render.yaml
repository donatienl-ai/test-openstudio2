# Blueprint Render : service back-end + base Postgres.
# Le site statique existant reste déployé tel quel.
services:
  - type: web
    name: openstudio-backend
    runtime: node
    rootDir: openstudio-backend
    buildCommand: npm ci || npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: openstudio-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OPUSCLIP_API_KEY
        sync: false
      - key: OPUSCLIP_WEBHOOK_SECRET
        sync: false
      - key: OPUSCLIP_DRY_RUN
        value: "true"
      - key: OPUSCLIP_CREDIT_BUDGET
        value: "3577"
      - key: OPUSCLIP_CREDITS_PER_MINUTE
        value: "1"
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: FILE_RETENTION_DAYS
        value: "30"
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: openstudio-db
    databaseName: openstudio
