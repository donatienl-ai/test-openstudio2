# Blueprint Render : service back-end OpenStudio (commandes, OpusClip, sous-titres).
# - Offre gratuite et région Frankfurt (sans précision, Render choisit une offre payante et l'Oregon).
#   Avant la production : passer le service sur une offre payante (mémoire pour ffmpeg, pas de mise en veille).
# - Aucune base n'est créée ici : la base PostgreSQL « openstudio-db » existe déjà (emails Mailjet).
#   Le back-end utilise une SECONDE base dans cette même instance, à créer une fois :
#     CREATE DATABASE openstudio_backend;
#   puis renseigner DATABASE_URL = Internal Database URL de openstudio-db, en remplaçant le nom de base
#   final par /openstudio_backend. (Les deux back-ends ont chacun une table « clients » : ils ne doivent
#   pas partager la même base.)
# - Le site statique (test-openstudio3) reste déployé tel quel.
services:
  - type: web
    name: openstudio-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: openstudio-backend
    buildCommand: npm ci || npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      # Connexion interne à Render : pas de SSL nécessaire.
      - key: DATABASE_SSL
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://test-openstudio3.onrender.com
      - key: OPUSCLIP_API_KEY
        sync: false
      - key: OPUSCLIP_WEBHOOK_SECRET
        sync: false
      - key: OPUSCLIP_DRY_RUN
        value: "true"
      # Tests : commandes envoyées réellement à OpusClip pour ces clients seulement (identifiants séparés
      # par des virgules, à saisir dans Render), malgré OPUSCLIP_DRY_RUN=true. Vider en production.
      - key: OPUSCLIP_LIVE_CLIENTS
        sync: false
      - key: OPUSCLIP_LIVE_MAX_MINUTES
        value: "10"
      - key: OPUSCLIP_CREDIT_BUDGET
        value: "3577"
      - key: OPUSCLIP_CREDITS_PER_MINUTE
        value: "1"
      # Stockage compatible S3. Tests : Backblaze B2, bucket privé en Europe (eu-central-003, Amsterdam).
      # Pour passer sur Cloudflare R2 : bucket R2, endpoint https://<ID_COMPTE>.r2.cloudflarestorage.com,
      # région « auto », et les clés R2 dans STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY.
      - key: STORAGE_BUCKET
        value: openstudio-tests-om
      - key: STORAGE_ENDPOINT
        value: https://s3.eu-central-003.backblazeb2.com
      - key: STORAGE_REGION
        value: eu-central-003
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: FILE_RETENTION_DAYS
        value: "30"
      # Tests uniquement : le client dépose lui-même sa vidéo depuis son espace. Passer à "false" en production
      # (les vidéos sont alors ajoutées par l'équipe via /api/admin/clients/:id/videos).
      - key: CLIENT_UPLOADS_ENABLED
        value: "true"
      # Tests uniquement : client de test créé au démarrage ; son lien d'accès apparaît dans les logs Render.
      # Laisser vide en production.
      - key: TEST_CLIENT_NAME
        value: "Client test OpenStudio"
      - key: ADMIN_TOKEN
        generateValue: true
      # Back-office de l'équipe (dossier admin/, site statique séparé : voir admin/README.md)
      - key: ADMIN_ORIGIN
        sync: false
      - key: ADMIN_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_NAME
        sync: false
      # Liens d'accès des clients envoyés par e-mail (lot 2)
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAILJET_FROM_EMAIL
        value: communication@openmedias.fr
      - key: MAIL_REDIRECT_TO
        sync: false
      # Alertes « diffusion incomplète » (vidéo ou e-mail manquant) : J-2, avancé au vendredi si week-end, et jour J
      - key: TEAM_ALERT_EMAIL
        value: communication@openmedias.fr
      # Planning de diffusion (dashboard) : https://openmedias-sales-dashboard.onrender.com/planning/api/openstudio/diffusions
      # et la clé = OPENSTUDIO_EXPORT_KEY du dashboard. Vides : pas de lecture du planning.
      - key: PLANNING_EXPORT_URL
        value: https://openmedias-sales-dashboard.onrender.com/planning/api/openstudio/diffusions
      - key: PLANNING_EXPORT_KEY
        sync: false
      # Google Drive : contenu du fichier de clé JSON du compte de service, et identifiant du dossier
      # (ou Drive partagé) partagé avec lui. Vides : Drive désactivé.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DRIVE_ROOT_FOLDER_ID
        sync: false
      # Publication sur les réseaux sociaux (Upload-Post) : clé API et secret des notifications (webhook).
      # À saisir dans Render ; ne jamais les mettre dans le dépôt ni dans le site.
      - key: UPLOAD_POST_API_KEY
        sync: false
      - key: UPLOAD_POST_WEBHOOK_SECRET
        sync: false
      # Légendes automatiques par réseau (API Claude) : clé côté serveur uniquement.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Paiement par carte (Stripe Checkout) : « Confier ma vidéo à un monteur ».
      # Sans STRIPE_SECRET_KEY, le paiement est simulé (tests). À saisir dans Render, jamais dans le dépôt.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Factures : jeton d'entreprise Pennylane (Paramètres → Connectivité → Développeurs, lecture et écriture).
      # Vide : factures Stripe comme avant. PENNYLANE_MOCK=1 : factures simulées (tests).
      - key: PENNYLANE_API_KEY
        sync: false
      # Destinataires des alertes : réglables dans le back-office (rubrique Alertes). Ces variables ne
      # servent que tant qu'une alerte n'y a pas été réglée. ACCOUNTING_EMAIL : e-mail « montage payé ».
      - key: ACCOUNTING_EMAIL
        sync: false
      # Adresse du back-office pour les liens dans les e-mails à l'équipe (ex. https://admin.openstudio.fr)
      - key: ADMIN_URL
        sync: false
      # Images des e-mails (dossier email/ du site client). Vide : https://test-openstudio3.onrender.com/email
      # (en recette : https://openstudio-recette.onrender.com/email). À changer avec le nom de domaine définitif.
      - key: EMAIL_ASSETS_URL
        sync: false
      # Lien « laisser un avis » de la fiche Google d'OpenMedias (e-mails de demande d'avis). Vide : recherche Google « OpenMedias avis ».
      - key: GOOGLE_REVIEW_URL
        sync: false
      # « recette » sur le serveur de recette uniquement (voir docs/RECETTE.md) ; vide en production.
      - key: APP_ENV
        sync: false
