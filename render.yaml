# Blueprint Render : service back-end OpenStudio (commandes, OpusClip, sous-titres).
# - Offre gratuite et région Frankfurt (sans précision, Render choisit une offre payante et l'Oregon).
#   Avant la production : passer le service sur une offre payante (mémoire pour ffmpeg, pas de mise en veille).
# - Aucune base n'est créée ici : la base PostgreSQL « openstudio-db » existe déjà (emails Mailjet).
#   Le back-end utilise une SECONDE base dans cette même instance, à créer une fois :
#     CREATE DATABASE openstudio_backend;
#   puis renseigner DATABASE_URL = Internal Database URL de openstudio-db, en remplaçant le nom de base
#   final par /openstudio_backend. (Les deux back-ends ont chacun une table « clients » : ils ne doivent
#   pas partager la même base.)
# - Le site statique (test-openstudio3) reste déployé tel quel.
services:
  - type: web
    name: openstudio-backend
    runtime: node
    plan: free
    region: frankfurt
    rootDir: openstudio-backend
    buildCommand: npm ci || npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      # Connexion interne à Render : pas de SSL nécessaire.
      - key: DATABASE_SSL
        value: "false"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://test-openstudio3.onrender.com
      - key: OPUSCLIP_API_KEY
        sync: false
      - key: OPUSCLIP_WEBHOOK_SECRET
        sync: false
      - key: OPUSCLIP_DRY_RUN
        value: "true"
      - key: OPUSCLIP_CREDIT_BUDGET
        value: "3577"
      - key: OPUSCLIP_CREDITS_PER_MINUTE
        value: "1"
      # Stockage compatible S3. Tests : Backblaze B2, bucket privé en Europe (eu-central-003, Amsterdam).
      # Pour passer sur Cloudflare R2 : bucket R2, endpoint https://<ID_COMPTE>.r2.cloudflarestorage.com,
      # région « auto », et les clés R2 dans STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY.
      - key: STORAGE_BUCKET
        value: openstudio-tests-om
      - key: STORAGE_ENDPOINT
        value: https://s3.eu-central-003.backblazeb2.com
      - key: STORAGE_REGION
        value: eu-central-003
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: FILE_RETENTION_DAYS
        value: "30"
      # Tests uniquement : le client dépose lui-même sa vidéo depuis son espace. Passer à "false" en production
      # (les vidéos sont alors ajoutées par l'équipe via /api/admin/clients/:id/videos).
      - key: CLIENT_UPLOADS_ENABLED
        value: "true"
      # Tests uniquement : client de test créé au démarrage ; son lien d'accès apparaît dans les logs Render.
      # Laisser vide en production.
      - key: TEST_CLIENT_NAME
        value: "Client test OpenStudio"
      - key: ADMIN_TOKEN
        generateValue: true
