<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>OpenStudio, prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0F33;--surface:#16163F;--surface-2:#1E1E4C;--ink:#3B3BFA;--on-ink:#FFFFFF;
    --text:#FFFFFF;--muted:#A3A3CC;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.18);--link:#9C9CFF;
    --onair:#3B3BFA;--onair-soft:#26266E;--danger:#FF7474;--danger-soft:#3D1F45;--ok:#4DD69A;--ok-soft:#173A3A;--warn:#F2B654;--warn-soft:#3A3040;
    --focus:#9C9CFF;--shadow:0 1px 2px rgba(0,0,10,.35),0 10px 28px rgba(0,0,10,.3);--netdark:#34347A;color-scheme:dark;
  --r-s:8px;--r-m:14px;--r-l:22px;--brand:#111137;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F0F33;--surface:#16163F;--surface-2:#1E1E4C;--ink:#3B3BFA;--on-ink:#FFFFFF;
    --text:#FFFFFF;--muted:#A3A3CC;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.18);--link:#9C9CFF;
    --onair:#3B3BFA;--onair-soft:#26266E;--danger:#FF7474;--danger-soft:#3D1F45;--ok:#4DD69A;--ok-soft:#173A3A;--warn:#F2B654;--warn-soft:#3A3040;
    --focus:#9C9CFF;--shadow:0 1px 2px rgba(0,0,10,.35),0 10px 28px rgba(0,0,10,.3);--netdark:#34347A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F0F33;--surface:#16163F;--surface-2:#1E1E4C;--ink:#3B3BFA;--on-ink:#FFFFFF;
    --text:#FFFFFF;--muted:#A3A3CC;--line:rgba(255,255,255,.09);--line-strong:rgba(255,255,255,.18);--link:#9C9CFF;
    --onair:#3B3BFA;--onair-soft:#26266E;--danger:#FF7474;--danger-soft:#3D1F45;--ok:#4DD69A;--ok-soft:#173A3A;--warn:#F2B654;--warn-soft:#3A3040;
    --focus:#9C9CFF;--shadow:0 1px 2px rgba(0,0,10,.35),0 10px 28px rgba(0,0,10,.3);--netdark:#34347A;color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F4FB;--surface:#FFFFFF;--surface-2:#ECECF7;--ink:#3B3BFA;--on-ink:#FFFFFF;
    --text:#111137;--muted:#5B5B85;--line:#DDDDEE;--line-strong:#C5C5DE;--link:#3B3BFA;
    --onair:#3B3BFA;--onair-soft:#E6E6FF;--danger:#D2334B;--danger-soft:#FCE6EA;--ok:#17805A;--ok-soft:#E0F3EA;--warn:#9A620E;--warn-soft:#FAEFD9;
    --focus:#3B3BFA;--shadow:0 1px 2px rgba(17,17,55,.06),0 8px 24px rgba(17,17,55,.07);--netdark:#111137;color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.15;letter-spacing:-.015em}
h1{font-size:clamp(26px,3.4vw,38px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Prototype bar */
.protobar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:6px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.protobar button{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12.5px}
.protobar button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* Site header (simulated openmedias.fr) */
.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--brand);border-bottom:1px solid rgba(255,255,255,.1);color:#fff}
.site-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:0 20px;height:64px}
.wordmark{display:flex;align-items:center;text-decoration:none;flex:none}
.wordmark img{height:44px;width:auto;display:block}
.site-nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.site-nav a,.site-nav button{text-decoration:none;font-size:14px;padding:8px 10px;border-radius:var(--r-s);color:rgba(255,255,255,.72);background:none;border:0}
.site-nav a:hover{color:#fff}
.site-nav .studio-tab{white-space:nowrap;color:#fff;font-weight:600;border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;gap:7px}
.site-nav .studio-tab.active{background:#3B3BFA;color:#fff;border-color:#3B3BFA}
.rec{width:7px;height:7px;border-radius:50%;background:#fff;display:inline-block}
.site-nav .participer{color:#fff;font-weight:600}
.menu-btn{display:none;margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:6px 10px}
@media (max-width:980px){
  .site-nav a.hide-m{display:none}
}
@media (max-width:640px){
  .site-nav a:not(.studio-tab){display:none}
  .site-in{gap:12px;height:56px}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-m);padding:10px 16px;font-weight:600;font-size:14.5px;border:1px solid transparent;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s}
.btn svg{width:17px;height:17px;flex:none}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-ghost{background:var(--surface);border-color:var(--line-strong)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-quiet{background:none;border:0;padding:8px 10px;color:var(--muted)}
.btn-quiet:hover{color:var(--text);background:var(--surface-2)}
.btn-danger{background:var(--surface);border-color:var(--line-strong);color:var(--danger)}
.btn-sm{padding:7px 11px;font-size:13.5px;border-radius:var(--r-s)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Login */
.login-wrap{min-height:calc(100vh - 100px);display:grid;grid-template-columns:1.05fr 1fr;max-width:1280px;margin:0 auto}
.login-side{padding:64px 48px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.login-side h1{font-size:clamp(32px,4.4vw,54px);font-weight:800;letter-spacing:-.035em;max-width:13ch}
.login-side .lead{font-size:18px;color:var(--muted);max-width:44ch}
.login-card{align-self:center;margin:40px 48px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:36px;box-shadow:var(--shadow)}
.code-input{width:100%;font-size:28px;font-weight:700;letter-spacing:.14em;text-align:center;padding:16px 12px;border:1.5px solid var(--line-strong);border-radius:var(--r-m);background:var(--bg);text-transform:uppercase}
.code-input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.code-input::placeholder{color:var(--line-strong)}
.code-input.err{border-color:var(--danger)}
.err-msg{color:var(--danger);font-size:13.5px;min-height:20px}
.demo-codes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.slate{display:flex;gap:18px;flex-wrap:wrap}
.slate div{border-left:2px solid var(--onair);padding-left:12px}
.slate b{display:block;font-size:22px}
.media-row{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-weight:600;font-size:14px}
@media (max-width:880px){
  .login-wrap{grid-template-columns:1fr}
  .login-side{padding:36px 20px 8px}
  .login-card{margin:16px 20px 40px;padding:24px}
}

/* App shell */
.app{display:grid;grid-template-columns:248px 1fr;max-width:1280px;margin:0 auto;min-height:calc(100vh - 100px)}
.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.company{display:flex;gap:11px;align-items:center;padding:6px 8px 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
.logo-tile{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.company b{display:block;font-size:14.5px;line-height:1.2}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:var(--r-s);text-decoration:none;color:var(--muted);font-weight:500;font-size:14.5px}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--surface-2);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--ink)}
.side-foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.main{padding:28px 32px 80px;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.page-head p{margin-top:6px;color:var(--muted);max-width:62ch}
.bottomnav{display:none}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:20px 16px 110px}
  .bottomnav{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottomnav.admin{grid-template-columns:repeat(5,1fr)}
  .bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;text-decoration:none;color:var(--muted);padding:4px 0}
  .bottomnav a.on{color:var(--text);font-weight:600}
  .bottomnav a.on .icon{stroke:var(--link)}
}
.impersonate{background:var(--warn-soft);color:var(--warn);font-size:13.5px;padding:8px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.impersonate button{background:none;border:1px solid currentColor;border-radius:999px;padding:2px 10px;color:inherit;font-size:13px}

/* Panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:22px}
.panel-flat{border:1px solid var(--line);border-radius:var(--r-l);padding:20px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1080px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:880px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media (max-width:560px){.g3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{margin-top:36px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}

/* Dashboard hero */
.hero{--onair:#fff;display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:30px;background:#3B3BFA;color:#fff;border-radius:var(--r-l);position:relative;overflow:hidden}
.hero > *{position:relative}
.hero .hero-mark{position:absolute;right:-30px;bottom:-40px;width:300px;opacity:.12;pointer-events:none}
.hero h1{font-size:clamp(24px,3vw,34px);max-width:22ch}
.hero p{opacity:.78;margin-top:10px;max-width:52ch}
.hero .btn-primary{background:#fff;color:#111137}
.hero .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .lbl b{font-size:34px;line-height:1}
.ring .lbl span{font-size:12px;opacity:.75}
@media (max-width:640px){.hero{grid-template-columns:1fr;padding:22px}.ring{width:108px;height:108px}}

.nextstep{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-left:4px solid var(--onair);background:var(--surface);border-radius:var(--r-m);padding:16px 18px;margin-top:18px}
.stats{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);margin-top:18px;overflow:hidden;flex-wrap:wrap}
.stats div{flex:1 1 140px;padding:14px 18px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-size:24px;font-weight:700}
.stats span{font-size:13px;color:var(--muted)}

/* Video thumbs */
.thumb{position:relative;aspect-ratio:16/9;border-radius:var(--r-m);overflow:hidden;background:#0A0A2A}
.thumb svg.scene{position:absolute;inset:0;width:100%;height:100%}
.lower3{position:absolute;left:10px;bottom:10px;right:10px;display:flex;flex-direction:column;align-items:flex-start;gap:0}
.lower3 .l1{background:var(--onair);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:2px 2px 0 0}
.lower3 .l2{background:rgba(255,255,255,.96);color:#111137;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:0 2px 2px 2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{position:absolute;top:8px;right:8px;background:rgba(10,18,32,.8);color:#fff;font-size:12px;font-weight:600;padding:2px 7px;border-radius:4px}
.vcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;border:0;background:none;text-align:left;padding:0;color:inherit}
.vcard:hover .thumb{outline:2px solid var(--ink);outline-offset:2px}
.vcard h3{font-size:16px}
.tag{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.red{background:var(--danger-soft);color:var(--danger)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}

/* Player */
.player{position:relative;aspect-ratio:16/9;border-radius:var(--r-l);overflow:hidden;background:#0A0A2A}
.player .scene{position:absolute;inset:0;width:100%;height:100%}
.player .ctrl{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;display:flex;align-items:center;gap:12px;background:linear-gradient(transparent,rgba(5,10,20,.75));color:#fff}
.player .ctrl button{background:#fff;color:#111137;border:0;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.player .ctrl button svg{width:16px;height:16px;fill:currentColor;stroke:none}
.pbar{flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;position:relative}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--onair);border-radius:2px;width:0}
.player .subline{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;background:rgba(5,10,20,.72);color:#fff;padding:5px 12px;border-radius:4px;font-weight:500;font-size:clamp(12px,1.6vw,17px);max-width:86%;text-align:center}

/* Timeline (signature element) */
.timeline{position:relative;height:74px;border-radius:var(--r-m);background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.timeline .wave{position:absolute;inset:10px 0 22px;display:flex;align-items:center;gap:2px;padding:0 6px}
.timeline .wave i{flex:1;background:var(--line-strong);border-radius:1px}
.timeline .seg{position:absolute;top:6px;bottom:18px;background:color-mix(in srgb,var(--onair) 45%,transparent);border:1.5px solid var(--link);border-radius:4px;cursor:pointer;display:flex;align-items:flex-start;justify-content:flex-start;padding:2px 4px;min-width:14px}
.timeline .seg b{background:var(--onair);color:#fff;font-size:11px;line-height:1;padding:3px 5px;border-radius:3px}
.timeline .seg.sel{background:color-mix(in srgb,var(--onair) 45%,transparent)}
.timeline .ticks{position:absolute;left:0;right:0;bottom:3px;display:flex;justify-content:space-between;padding:0 8px;font-size:10.5px;color:var(--muted)}

/* Capsule tool */
.steps-h{display:flex;gap:8px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.steps-h span{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.steps-h span b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);font-size:12px}
.steps-h span.on{color:var(--text);font-weight:600}
.steps-h span.on b{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.steps-h span.done b{background:var(--ok);color:#fff;border-color:var(--ok)}
.steps-h hr{width:28px;border:0;border-top:1.5px solid var(--line-strong);margin:0}
.pick{border:1.5px solid var(--line);border-radius:var(--r-l);padding:10px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:10px}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 14%,transparent)}
.pick .meta{padding:0 4px 4px}
.seg-ctl{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-m);padding:3px;background:var(--surface);gap:2px;flex-wrap:wrap}
.seg-ctl button{border:0;background:none;padding:8px 14px;border-radius:7px;font-weight:600;font-size:14px;color:var(--muted)}
.seg-ctl button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.fmt-opt{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-m);padding:14px 18px;min-width:108px}
.fmt-opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 14%,transparent)}
.fmt-opt i{display:block;border:2px solid currentColor;border-radius:3px}
.fmt-opt small{color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px}
.field > label,.field > .lab{font-weight:600;font-size:14px}
.analysis{display:flex;flex-direction:column;gap:12px;max-width:440px;margin:40px auto;text-align:left}
.analysis .st{display:flex;align-items:center;gap:12px;color:var(--muted)}
.analysis .st.on{color:var(--text);font-weight:600}
.analysis .st.done{color:var(--ok)}
.analysis .st i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;flex:none}
.analysis .st.on i{border-color:var(--onair);border-top-color:transparent;animation:spin .8s linear infinite}
.analysis .st.done i{background:var(--ok);border-color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.analysis .st.on i{animation:none}}

.prop{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;padding:18px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface)}
.prop.sel{border-color:var(--onair)}
.prop .rank{font-size:13px;font-weight:700;color:var(--link)}
.score{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
.score .bar{width:90px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--onair)}
.reason{background:var(--surface-2);border-radius:var(--r-s);padding:9px 12px;font-size:14px}
@media (max-width:640px){.prop{grid-template-columns:1fr}.prop .frame-wrap{justify-self:center}}

.frame{position:relative;border-radius:10px;overflow:hidden;background:#0A0A2A;flex:none}
.frame .scene{position:absolute;inset:0;width:100%;height:100%}
.r916{width:168px;aspect-ratio:9/16}
.r11{width:230px;aspect-ratio:1/1}
.r169{width:300px;aspect-ratio:16/9}
@media (max-width:640px){.r169{width:100%}.r11{width:100%;max-width:300px}.r916{width:190px}}
.frame .sub{position:absolute;left:8%;right:8%;text-align:center;color:#fff;transition:opacity .2s}
.sub-classique{bottom:14%;font-size:13px;font-weight:600;background:rgba(5,10,20,.7);padding:5px 8px;border-radius:4px}
.sub-impact{bottom:30%;font-size:17px;font-weight:800;line-height:1.3;text-shadow:0 2px 0 #111137,0 0 8px rgba(0,0,0,.6),2px 0 0 #111137,-2px 0 0 #111137,0 -2px 0 #111137}
.sub-impact em{font-style:normal;background:var(--hl,#3B3BFA);color:#fff;padding:0 5px;border-radius:3px;text-shadow:none;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub-minimal{bottom:8%;font-size:11.5px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.9)}
.r169 .sub-impact{bottom:18%;font-size:15px}
.frame .wm{position:absolute;top:8px;left:8px;font-size:10px;font-weight:800;color:#fff;opacity:.85;display:flex;align-items:center;gap:4px;letter-spacing:-.02em}
.frame .wm i{width:5px;height:5px;border-radius:50%;background:var(--onair);display:inline-block}
.frame .fplay{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);color:#111137;border:0;display:grid;place-items:center}
.frame .fplay svg{width:12px;height:12px;fill:currentColor;stroke:none}
.frame .fprog{position:absolute;left:0;bottom:0;height:3px;background:var(--onair);width:0}
.frame .ftime{position:absolute;right:8px;bottom:8px;font-size:10.5px;color:#fff;background:rgba(5,10,20,.6);padding:1px 5px;border-radius:3px}

/* Subtitle editor */
.sub-edit{display:grid;grid-template-columns:auto 1fr;gap:24px}
.sub-edit .lines{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding-right:4px}
.sub-edit .ln{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start}
.sub-edit .ln span{font-size:12.5px;color:var(--muted);padding-top:9px}
.sub-edit textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:8px 10px;background:var(--bg);resize:vertical;min-height:40px}
@media (max-width:720px){.sub-edit{grid-template-columns:1fr}.sub-edit .frame{justify-self:center}}

/* Publications */
.pub-layout{display:grid;grid-template-columns:330px 1fr;gap:22px;align-items:start}
@media (max-width:1080px){.pub-layout{grid-template-columns:1fr}}
.src-list{display:flex;flex-direction:column;gap:6px}
.src{display:flex;gap:10px;align-items:center;padding:9px 10px;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-align:left}
.src[aria-pressed="true"]{border-color:var(--ink)}
.src .mini{width:54px;aspect-ratio:16/9;border-radius:5px;overflow:hidden;position:relative;flex:none;background:#0A0A2A}
.src .mini svg{position:absolute;inset:0;width:100%;height:100%}
.src b{font-size:13.5px;display:block;line-height:1.25}
.src small{color:var(--muted);font-size:12px}
.net{width:22px;height:22px;border-radius:6px;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.net-linkedin{background:#0A66C2}.net-instagram{background:#C13584}.net-facebook{background:#1877F2}.net-tiktok{background:var(--netdark)}.net-x{background:var(--netdark)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;display:flex;gap:8px;align-items:center;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--ink)}
.post{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);display:flex;flex-direction:column}
.post-top{display:flex;gap:10px;align-items:center;padding:14px 16px 8px}
.post-top .logo-tile{width:36px;height:36px;border-radius:50%;font-size:12px}
.post-top b{font-size:14px;display:block;line-height:1.2}
.post-body{padding:4px 16px 12px;white-space:pre-wrap;font-size:14.5px;line-height:1.55;flex:1}
.post-body .hook{font-weight:700}
.post-body .ht{color:var(--link)}

.post textarea{margin:4px 16px 12px;min-height:220px;border:1px solid var(--line-strong);border-radius:var(--r-s);padding:10px;background:var(--bg);resize:vertical;width:calc(100% - 32px)}
.post-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.count{font-size:12.5px;color:var(--muted)}
.count.over{color:var(--danger);font-weight:600}
.empty{border:1.5px dashed var(--line-strong);border-radius:var(--r-l);padding:40px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted)}
.empty h3{color:var(--text)}
.thinking{display:flex;gap:10px;align-items:center;padding:30px;justify-content:center;color:var(--muted)}
.thinking i{width:18px;height:18px;border-radius:50%;border:2px solid var(--onair);border-top-color:transparent;animation:spin .8s linear infinite}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .d{min-height:92px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.cal .d.past{opacity:.55}
.cal .d.today{border-color:var(--onair);box-shadow:inset 0 0 0 1px var(--onair)}
.cal .d .n{font-weight:600;color:var(--muted);display:flex;justify-content:space-between}
.cal .ev{display:flex;gap:5px;align-items:flex-start;background:var(--surface-2);border:0;border-radius:5px;padding:4px 5px;text-align:left;font-size:11.5px;line-height:1.25}
.cal .ev .net{width:16px;height:16px;font-size:8.5px;border-radius:4px}
.cal-head{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;text-align:center}
@media (max-width:720px){
  .cal,.cal-head{grid-template-columns:1fr}
  .cal-head{display:none}
  .cal .d{min-height:0}
  .cal .d.empty-d{display:none}
  .cal .pad{display:none}
}
.quote{border-left:3px solid var(--onair);padding:4px 0 4px 16px}
.quote p{font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-.01em}

/* Lists / tables */
.list{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.li{display:flex;gap:14px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .fi{width:40px;height:40px;border-radius:var(--r-s);background:var(--surface-2);display:grid;place-items:center;flex:none}
.li .grow{flex:1;min-width:0}
.li .grow b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:1000px;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.code-pill{white-space:nowrap;font-weight:700;letter-spacing:.06em;font-size:13px;background:var(--surface-2);padding:3px 8px;border-radius:5px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:var(--r-m);padding:0 12px;background:var(--surface);min-width:240px}
.search input{border:0;background:none;padding:10px 0;outline:none;width:100%}
.kpi{padding:18px;border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface)}
.kpi b{display:block;font-size:30px;font-weight:700;line-height:1.1;margin-top:4px}
.kpi span{font-size:13.5px;color:var(--muted)}
.input,.select,.textarea{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-m);padding:10px 12px;background:var(--bg)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--ink)}
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r-l);padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.drop.over{border-color:var(--ink);background:var(--surface-2)}
.prog{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:100%}
.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.toggle{position:relative;width:38px;height:22px;border-radius:999px;background:var(--line-strong);border:0;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-checked="true"]{background:var(--ok)}
.toggle[aria-checked="true"]::after{left:19px}
.chart{width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* Access */
.access-track{position:relative;height:10px;background:var(--surface-2);border-radius:5px;margin:34px 0 44px}
.access-track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:5px}
.access-track .mk{position:absolute;top:-26px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:center}
.access-track .mk::after{content:"";display:block;width:1.5px;height:14px;background:var(--line-strong);margin:3px auto 0}
.access-track .now{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--onair);border:3px solid var(--surface);transform:translate(-50%,-50%)}
.access-track .ends{position:absolute;top:18px;font-size:12px;color:var(--muted)}

/* Modal & toast */
.overlay{position:fixed;inset:0;background:rgba(8,14,26,.55);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-l);max-width:720px;width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-b{padding:22px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100vw - 32px)}
@media (max-width:880px){.toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--on-ink);padding:11px 16px;border-radius:var(--r-m);font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
.onb-art{aspect-ratio:16/7;border-radius:var(--r-m);overflow:hidden;position:relative;background:#0A0A2A;margin-bottom:18px}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.dots i.on{background:var(--onair);width:18px;border-radius:4px}
.blocked{max-width:560px;margin:70px auto;padding:0 20px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.blocked .fi{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--onair-soft);color:var(--link)}
.foot-site{border-top:1px solid var(--line);padding:18px 20px;text-align:center;font-size:13px;color:var(--muted)}
.foot-site a{margin:0 8px}
details summary{cursor:pointer;font-weight:600}
.vgrid{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:26px}.accgrid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}@media (max-width:980px){.vgrid,.accgrid{grid-template-columns:1fr}}
.vis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;align-items:start}
.vis-card{border:1px solid var(--line);border-radius:var(--r-l);background:var(--surface);overflow:hidden}
.vis-prev{background:#0A0A2A;line-height:0}
.vis-prev svg{width:100%;height:auto;display:block}
.vis-hist{display:flex;gap:12px;flex-wrap:wrap}
.vis-mini{width:120px;padding:0;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:none;line-height:0}
.vis-mini svg{width:100%;height:auto;display:block}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.ph{margin:0;border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
.ph.on{border-color:var(--ink)}
.ph-img{aspect-ratio:3/2;line-height:0}
.ph-img svg,.ph-mini svg{width:100%;height:100%;display:block}
.ph figcaption{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 6px 6px 10px}
.ph figcaption .small{line-height:1.25}
.ph-mini{width:60px;aspect-ratio:3/2;border-radius:5px;overflow:hidden;flex:none;line-height:0}
.tpl-ico{width:44px;height:44px;border-radius:8px;flex:none;position:relative;background:#111137;overflow:hidden}
.tpl-ico::before,.tpl-ico::after{content:"";position:absolute;background:#3B3BFA;border-radius:2px}
.tpl-citation::before{left:7px;right:12px;top:18px;height:5px;background:#fff}.tpl-citation::after{left:7px;right:18px;top:27px;height:5px;background:#fff;box-shadow:0 -16px 0 -1px #3B3BFA}
.tpl-chiffre{background:linear-gradient(#6F7FA8 0 45%,#111137 45%)}.tpl-chiffre::before{left:7px;width:22px;top:24px;height:10px;background:#fff}.tpl-chiffre::after{left:7px;width:10px;top:37px;height:3px}
.tpl-coulisses{background:#6F7FA8}.tpl-coulisses::before{left:5px;right:5px;bottom:12px;height:12px;background:#fff}.tpl-coulisses::after{left:0;right:0;bottom:0;height:8px;background:#111137}
.m-logo{height:96px;border-radius:var(--r-m);display:grid;place-items:center;padding:14px;border:1px solid var(--line)}
.m-logo img{max-height:100%;max-width:100%;object-fit:contain}
.m-logo span{font-size:13px;opacity:.8}
.small-logo{height:72px}
.swatch{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-strong);display:inline-block}
.colorpick{width:44px;height:40px;border:1px solid var(--line-strong);border-radius:var(--r-s);background:none;padding:2px;flex:none}
.ai-rules{white-space:pre-wrap;font-family:inherit;font-size:13px;background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;margin:8px 0 0}
@media (max-width:980px){#mgrid{grid-template-columns:1fr!important}#mgrid aside{position:static!important}}
.fmedia{position:absolute;left:8px;bottom:8px;font-size:10px;font-weight:700;color:#fff;padding:2px 7px;border-radius:999px;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-src{width:100%;border-radius:var(--r-m);background:#000;max-height:240px}
.tframe video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.tf916{width:230px;aspect-ratio:9/16}.tf11{width:300px;aspect-ratio:1/1}.tf169{width:420px;aspect-ratio:16/9}
@media (max-width:640px){.tf169{width:100%}.tf11{width:100%;max-width:320px}.tf916{width:220px}}
.tframe .sub-impact{font-size:18px}
.tframe .wm{left:auto;right:8px;top:8px}.tframe .fmedia{top:8px;bottom:auto;left:8px;max-width:58%}.tframe .wm{max-width:36%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tframe .fmedia-logo img{height:16px}.tframe .fplay{top:auto;bottom:24px;right:8px}
.t-hook{position:absolute;left:8%;right:8%;top:15%;margin:0 auto;width:max-content;max-width:84%;color:#fff;font-weight:800;font-size:15px;line-height:1.25;text-align:center;padding:4px 8px;border-radius:3px}
.fmedia-logo{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:11.5px}
.fmedia-logo img{height:22px;width:auto;max-width:120px;object-fit:contain;display:block}
.t-band{position:absolute;left:0;right:0;overflow:hidden;z-index:1}
.t-band video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tframe .t-bgv{filter:blur(14px) brightness(.55);transform:scale(1.12)}

.t-half{position:absolute;left:0;right:0;height:50%;overflow:hidden}
.t-half video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.t-divider{position:absolute;left:0;right:0;top:calc(50% - 1.5px);height:3px;z-index:1}
.spin-sm{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--link);border-top-color:transparent;animation:spin .8s linear infinite;margin-right:6px;vertical-align:-1px}
.t-track .icon{width:14px;height:14px;vertical-align:-2px;color:var(--ok)}
.spk-row{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.spk-row .input{padding:8px 10px;font-size:14px}

.t-l3 span{font-size:10px;font-weight:600;padding:2px 7px;line-height:1.25;max-width:90%}
.t-l3.off{opacity:0;transform:translateX(-30%)}
.tframe .t-jingle{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5;background:#000}
.tframe video.t-main{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.tframe video.t-bgv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.shot{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:var(--r-s);padding:6px;background:var(--surface-2)}
.shot img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;display:block}
.shot .select{padding:5px 6px;font-size:13px}
.tframe .sub,.tframe .t-hook,.tframe .t-l3,.tframe .fmedia,.tframe .wm{pointer-events:none}.tframe .fplay{z-index:6}
.sp-player{position:relative;background:#000;border-radius:var(--r-l);overflow:hidden;line-height:0}
.sp-player video{width:100%;max-height:62vh;display:block;background:#000}
.sp-line{position:absolute;left:50%;transform:translateX(-50%);bottom:16%;margin:0;max-width:84%;text-align:center;color:#fff;line-height:1.3;pointer-events:none;visibility:hidden}

.sp-type-sample{font-family:"DM Sans",Helvetica,Arial,sans-serif;font-weight:400;font-size:26px;color:#fff;-webkit-text-stroke:5px #000;paint-order:stroke fill;background:#6F7FA8;border-radius:var(--r-s);padding:8px 12px}
.sp-classique{background:rgba(5,10,20,.75);padding:3px 10px;border-radius:4px;font-weight:600}
.sp-impact{font-weight:800;text-shadow:0 2px 0 #111137,2px 0 0 #111137,-2px 0 0 #111137,0 -2px 0 #111137,0 0 8px rgba(0,0,0,.6)}
.sp-minimal{font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.95)}
.sp-list{max-height:56vh;overflow:auto;padding:6px 8px}
.sp-row{display:grid;grid-template-columns:88px 1fr 32px;gap:8px;align-items:start;padding:5px 6px;border-radius:var(--r-s)}
.sp-row.on{background:var(--onair-soft)}
.sp-row .textarea{resize:none;overflow:hidden;padding:7px 9px;font-size:14px;min-height:36px}
.sp-time{border:0;background:var(--surface-2);color:var(--link);border-radius:6px;padding:7px 6px;font-size:12.5px;font-weight:600}

async function bkSubmitSubtitles() {

  if (!c.disabled && !c.unlimited && !c.activatedAt && c.diffusion && c.diffusion > TODAY && !c.openNow) return { k: 'prep', label: 'En préparation', cls: '' };

function viewLogin() {
  return `<main class="login-wrap">
  <section class="login-side">
    <span class="eyebrow"><i></i>OpenStudio, l'espace client OpenMedias</span>
    <h1>Votre émission, <span class="serif">sur tous vos réseaux.</span></h1>
    <p class="lead">Retrouvez votre émission, vos photos et l'article réalisés par OpenMedias, et transformez-les en quelques clics en capsules, teasers, visuels et publications pour vos réseaux sociaux.</p>
    <div class="slate">
      <div><b>Tous vos contenus</b><span class="muted small">vidéos, photos et articles réunis</span></div>
      <div><b>Prêts pour vos réseaux</b><span class="muted small">capsules, visuels et posts en quelques clics</span></div>
      <div><b class="num">30 jours</b><span class="muted small">d'accès, à votre rythme</span></div>
    </div>
    <div class="media-row" aria-label="Médias partenaires"><span>Le Figaro</span><span>BFM Business</span><span>Capital</span><span>BFM TV</span><span>Time</span></div>
  </section>
  <section class="login-card" aria-labelledby="login-t">
    <h2 id="login-t">Connexion à votre espace</h2>
    <p class="muted" style="margin:8px 0 22px">Entrez le code personnel transmis par votre chargé de projet OpenMedias.</p>
    <form id="login-form" novalidate>
      <label class="visually-hidden" for="code">Code d'accès</label>
      <input id="code" class="code-input num" autocomplete="one-time-code" inputmode="text" maxlength="10" placeholder="OM-0000-XX" aria-describedby="code-err">
      <p class="err-msg" id="code-err" role="alert"></p>
      <button class="btn btn-primary" style="width:100%;padding:14px" type="button" data-a="do-login">Accéder à mon espace</button>
    </form>
    <div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)">
      <p class="small muted">Codes de démonstration</p>
      <div class="demo-codes">
        ${[['c1', 'actif'], ['c3', '1re connexion'], ['c4', 'expiré']].map(([id, l]) => { const c = CLIENTS.find(x => x.id === id); return c ? `<button class="chip" data-a="fill-code" data-arg="${c.code}">${c.code} <span class="muted">${esc(c.name.split(' ')[0])}, ${l}</span></button>` : ''; }).join('')}
      </div>
    </div>
    <button class="btn btn-ghost" style="width:100%;margin-top:16px" data-a="quick-test">${I('video')}Tester directement avec une de mes vidéos</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px" data-a="quick-subs">${I('quote')}Sous-titrer une de mes vidéos</button>
    <p class="small muted" style="margin-top:18px">Code perdu ? Contactez votre chargé de projet ou écrivez à <a href="mailto:contact@openmedias.fr">contact@openmedias.fr</a>.</p>

function normCode(v) {
  const s = v.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  let out = s.slice(0, 2); if (s.length > 2) out += '-' + s.slice(2, 6); if (s.length > 6) out += '-' + s.slice(6, 8);
  return out;
}
function doLogin(code) {
  const err = document.getElementById('code-err'), inp = document.getElementById('code');
  let c = CLIENTS.find(x => x.code === code);
  if (!c && DEFAULT_CODES[code]) { c = CLIENTS.find(x => x.id === DEFAULT_CODES[code]); if (c) c.code = code; }
  if (!c) {
    S.fails++; inp.classList.add('err');
    const raw = String(inp ? inp.value : code).toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (['OM1210BW', 'BAUWATCH'].includes(raw)) { err.innerHTML = 'Ce code ouvre l\'espace de démonstration BauWatch, qui se trouve sur un autre lien : <a href="https://claude.ai/artifact/3zSBG9Ni58vVTD2JVkBqYH" target="_blank" rel="noopener">ouvrir la démo BauWatch</a>.'; return; }
    err.textContent = "Ce code ne correspond à aucun espace. Vérifiez la saisie (format OM-0000-XX) ou contactez votre chargé de projet.";
    return;
  }
  S.fails = 0;
  const st = statusOf(c);
  if (st.k === 'prep') { S.clientId = c.id; S.view = 'blocked'; render(); return; }
  S.clientId = c.id; S.asAdmin = false;
  if (st.k === 'disabled' || st.k === 'expired') { S.view = 'blocked'; render(); return; }
  const firstLogin = !c.activatedAt; /* Emails : première connexion */
  if (!c.activatedAt) { c.activatedAt = new Date(TODAY); c.expiresAt = addDays(TODAY, c.duration); S.modal = { type: 'onboarding' }; S.onb = 0; }
  c.lastLogin = new Date(TODAY); c.stats.logins++;
  resetClientState();
  trackEvent('user.login', { first: firstLogin }, firstLogin ? 'first-login' : 'login-' + Date.now().toString(36)); /* Emails : parcours Activation (1re connexion) */
  go('client', 'dashboard');
}
function resetClientState() {

}

function vcard(v) {
  return `<button class="vcard" data-a="open-video" data-arg="${v.id}" aria-label="Ouvrir ${esc(v.title)}">${thumb(v)}<div><h3>${esc(v.title)}</h3><div class="row" style="margin-top:6px;gap:6px"><span class="tag">${esc(v.kind)}</span><span class="small muted">${esc(v.media)}, ${fmtShort(v.date)}</span></div></div></button>`;
}
function pVideos(c) {
  const cards = CV().flatMap(v => [vcard2(v, false), ...(hasSubVersion(v) ? [vcard2(v, true)] : [])]);
  return `<div class="page-head"><div><h1>Mes vidéos</h1><p>Regardez les vidéos réalisées par OpenMedias pour ${esc(c.name)}, sans ou avec sous-titres.</p></div></div>
  <div class="grid g3">${cards.join('') || `<p class="muted">Vos vidéos seront disponibles ici dès que l'équipe OpenMedias les aura ajoutées.</p>`}</div>`;
}
function vcard2(v, sub) {
  if (v.uploaded && v.version === 'avec') sub = true;
  return `<button class="vcard" data-a="open-video" data-arg="${v.id}|${sub && !(v.uploaded && v.version === 'avec') ? 'sub' : ''}" aria-label="Regarder ${esc(v.title)} ${sub ? 'avec' : 'sans'} sous-titres">${thumb(v)}<div><h3>${esc(v.title)}</h3><div class="row" style="margin-top:6px;gap:6px"><span class="tag ${sub ? 'ok' : ''}">${sub ? 'Avec sous-titres' : 'Sans sous-titres'}</span><span class="small muted">${esc(v.media)}, ${fmtShort(v.date)}</span></div></div></button>`;
}
function timelineHtml(v, segs, sel = -1, act = 'tl-seg') {
  let bars = ''; for (let i = 0; i < 90; i++) { const h = 18 + Math.abs(Math.sin(i * 1.7 + v.duration) * 52) + Math.abs(Math.cos(i * .63)) * 28; bars += `<i style="height:${Math.min(100, h)}%"></i>`; }
  const ticks = [0, .25, .5, .75, 1].map(f => `<span class="num">${tc(v.duration * f)}</span>`).join('');
  return `<div class="timeline" role="group" aria-label="Frise de la vidéo avec les moments forts"><div class="wave">${bars}</div>
  ${segs.map((s, i) => `<button class="seg ${i === sel ? 'sel' : ''}" style="left:${s.start / v.duration * 100}%;width:${Math.max(2.2, s.dur / v.duration * 100)}%" data-a="${act}" data-arg="${i}" aria-label="Moment ${i + 1} : ${esc(s.title)}, à ${tc(s.start)}"><b>${i + 1}</b></button>`).join('')}
  <div class="ticks">${ticks}</div></div>`;
}
function pVideo(c, v) {
  if (v.url || isOpusVideo(v)) return pVideoReal(c, v); /* OpusClip : vidéo déposée lors d'une session précédente */
  const segs = v.highlights.map(h => ({ start: h.start, dur: 40, title: h.title }));
  const allLines = v.highlights.flatMap(h => h.lines.map((l, i) => ({ t: h.start + i * 7, l })));
  return `<div class="row" style="margin-bottom:14px"><button class="btn btn-quiet btn-sm" data-a="nav" data-arg="videos">${I('back')}Mes vidéos</button></div>
  <div class="grid vgrid">
    <div>
      <div class="player" id="player" data-dur="${v.duration}">${scene(v)}<p class="subline" id="psub" style="${S.vsub ? '' : 'display:none'}">${esc(allLines[0].l.replace(/\*/g, ''))}</p>
        <div class="ctrl"><button data-a="play-main" aria-label="Lire">${IF('play')}</button><span class="num small" id="ptime">0:00 / ${tc(v.duration)}</span><div class="pbar"><i id="pbar"></i></div></div></div>
      <h1 style="margin-top:20px;font-size:28px">${esc(v.title)}</h1>
      <div class="row" style="margin-top:8px;gap:8px"><span class="tag ${S.vsub ? 'ok' : ''}">${S.vsub ? 'Avec sous-titres' : 'Sans sous-titres'}</span><span class="tag">${esc(v.kind)}</span><span class="muted small">${esc(v.media)}, diffusé le ${fmtD(v.date)}, ${tc(v.duration)}</span></div>
      <p style="margin-top:14px;max-width:68ch">${esc(v.summary)}</p>
      <section class="sec" style="margin-top:28px"><div class="sec-head"><h2>Moments forts détectés</h2><span class="small muted">Préparés à l'analyse de votre vidéo</span></div>
        ${timelineHtml(v, segs, -1, 'vid-seg')}
        <div class="list" style="margin-top:12px">${v.highlights.map((h, i) => `<div class="li"><span class="fi num" style="font-weight:700;color:var(--link)">${i + 1}</span><div class="grow"><b>${esc(h.title)}</b><span class="small muted num">à ${tc(h.start)}, « ${esc(h.lines[0].replace(/\*/g, ''))} »</span></div><button class="btn btn-ghost btn-sm" data-a="cap-from" data-arg="${v.id}|${i}">${I('spark')}Créer la capsule</button></div>`).join('')}</div>
      </section>
      <details style="margin-top:28px" class="panel-flat"><summary>Transcription (extrait)</summary><div class="transcript" style="margin-top:10px">${allLines.slice(0, 14).map(x => `<p><span class="num">${tc(x.t)}</span>${esc(x.l.replace(/\*/g, ''))}</p>`).join('')}</div></details>
    </div>
    <aside class="stack">

  const prev = `<div class="grid g3">${[base(0, { tpl: 'citation', main: q, sub: c.contact }), base(1, { tpl: FACTS.length ? 'chiffre' : 'coulisses', main: FACTS.length ? FACTS[0].n : 'Dans les coulisses', sub: FACTS.length ? FACTS[0].l : '' }), base(2, { tpl: 'coulisses', main: CAPTIONS[0] || 'Dans les coulisses du tournage', sub: '' })].map(p => `<div class="vis-prev" style="border-radius:12px;overflow:hidden">${visualSVG(p)}</div>`).join('')}</div>`;
  return lockedPage('Visuels', "Vos photos et les phrases fortes de votre émission transformées en visuels pour LinkedIn et Instagram, avec signature d'e-mail et bandeau de site.", 'pack-com', prev);
}

/* ---- Téléchargements ---- */
function pDownloads(c) {
  const items = [
    ...S.saved.map(s => ({ k: 'capsule', name: (s.kind === 'teaser' ? 'Teaser : ' : 'Capsule : ') + s.title, meta: `${s.dur} s, ${s.fmt}, créée le ${fmtShort(s.created)}`, file: capFile(s), size: '18 Mo', brand: s.opusId ? s : null })),
    ...S.saved.filter(s => !s.opusId).map(s => ({ k: 'srt', name: 'Sous-titres : ' + s.title, meta: 'Fichier .srt, compatible YouTube, LinkedIn, Premiere', srt: s.id })),
    ...S.visSaved.map(p => ({ k: 'visuel', name: 'Visuel : ' + TPL[p.tpl].name + ', ' + (p.tpl === 'chiffre' ? p.main + ' ' + p.sub : p.main).slice(0, 60), meta: `PNG 1080 × ${FMT_H[p.fmt]} px, format ${p.fmt}`, vis: p.k })),
  ];
  const f = S.dlFilter; const shown = items.filter(i => f === 'all' || i.k === f);
  const fl = [['all', 'Tout'], ['capsule', 'Capsules'], ['srt', 'Sous-titres'], ['visuel', 'Visuels']];
  const ic = { video: 'video', capsule: 'spark', srt: 'file', article: 'file', visuel: 'image' };
  return `<div class="page-head"><div><h1>Mes créations</h1><p>Les capsules, visuels et sous-titres que vous avez créés dans OpenStudio. Vos vidéos et articles d'origine sont dans « Mes médias ».</p></div><button class="btn btn-primary" data-a="dl-sim" data-arg="openmedias_${c.name.toLowerCase().replace(/\W+/g, '-')}_tous-les-contenus.zip|4,6 Go">${I('down')}Tout télécharger (.zip)</button></div>
  <div class="row" style="gap:6px;margin-bottom:14px" role="group" aria-label="Filtrer">${fl.map(([k, l]) => `<button class="chip" data-a="dl-filter" data-arg="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>
  ${shown.length ? `<div class="list">${shown.map(i => `<div class="li"><span class="fi">${I(ic[i.k])}</span><div class="grow"><b>${esc(i.name)}</b><span class="small muted">${esc(i.meta)}</span></div>${i.brand ? `<span class="small muted" data-bstat="${esc(bKey(i.brand))}"></span><button class="btn btn-ghost btn-sm" data-a="dl-brand" data-arg="${i.brand.id}">${I('down')}Télécharger</button>` : i.vis ? `<button class="btn btn-ghost btn-sm" data-a="vis-redl" data-arg="${i.vis}">${I('down')}Télécharger</button>` : i.srt ? `<button class="btn btn-ghost btn-sm" data-a="srt" data-arg="${i.srt}">${I('down')}Télécharger</button>` : `<button class="btn btn-ghost btn-sm" data-a="dl-sim" data-arg="${esc(i.file)}|${esc(i.size)}">${I('down')}Télécharger</button>`}</div>`).join('')}</div>`
    : `<div class="empty"><h3>Aucune création pour l'instant</h3><p>Les capsules, visuels et sous-titres que vous créez apparaissent ici, prêts à télécharger.</p><button class="btn btn-primary" data-a="nav" data-arg="capsules">Créer une capsule</button></div>`}`;
}

/* ---- Accès ---- */
function pAccess(c) {
  const total = Math.round((c.expiresAt - c.activatedAt) / DAY); const used = Math.round((TODAY - c.activatedAt) / DAY); const left = daysLeft(c);
  const mk = [[3, 'Rappel J+3'], [15, 'Idées J+15'], [total - 5, 'Rappel J-5']];
  return `<div class="page-head"><div><h1>Mon accès</h1><p>Votre espace reste ouvert ${total} jours après votre première connexion.</p></div></div>
  <div class="grid accgrid">
    <div class="panel">
      <div class="row" style="gap:26px;align-items:center">${ring(left, total, 120)}<div><h2>Il vous reste ${left} jours</h2><p class="muted" style="margin-top:6px">Accès activé le ${fmtD(c.activatedAt)}, valable jusqu'au ${fmtD(c.expiresAt)} inclus.</p></div></div>
      <div class="access-track" aria-hidden="true"><span class="fill" style="width:${used / total * 100}%"></span>${mk.map(([d, l]) => `<span class="mk" style="left:${d / total * 100}%">${l}</span>`).join('')}<span class="now" style="left:${used / total * 100}%"></span><span class="ends" style="left:0">${fmtShort(c.activatedAt)}</span><span class="ends" style="right:0">${fmtShort(c.expiresAt)}</span></div>
      <h3>Ce qui se passe à l'expiration</h3>
      <p class="muted" style="margin-top:6px;max-width:62ch">Votre espace passe en lecture seule pendant 7 jours pour vous laisser récupérer vos fichiers, puis il est fermé. Vos contenus sont ensuite supprimés de nos serveurs, conformément à notre politique de confidentialité. Pensez à télécharger vos capsules avant cette date.</p>
      <div class="row" style="margin-top:18px"><button class="btn btn-primary" data-a="ext-modal">${I('clock')}Demander une prolongation</button><button class="btn btn-ghost" data-a="nav" data-arg="downloads">${I('down')}Mes téléchargements</button></div>
    </div>
    <div class="stack">
      <div class="panel"><h3>Votre chargée de projet</h3><div class="row" style="margin-top:14px;flex-wrap:nowrap"><span class="logo-tile" style="background:#3B3BFA;color:#fff;border-radius:50%">LD</span><div><b>${esc(c.manager)}</b><div class="small muted">OpenMedias</div></div></div>
        <div class="stack" style="margin-top:14px;gap:8px"><a class="btn btn-ghost btn-sm" href="mailto:lola@openmedias.fr">${I('mail')}lola@openmedias.fr</a><a class="btn btn-ghost btn-sm" href="tel:+33785880962">07 85 88 09 62</a></div></div>
      <div class="panel"><h3>Sécurité de votre espace</h3><p class="muted small" style="margin-top:6px">Votre code est personnel : ne le partagez pas en dehors de votre entreprise. Seules les personnes disposant du code peuvent voir vos contenus, et chaque téléchargement utilise un lien temporaire.</p></div>
    </div>
  </div>`;
}

function aClients() {
  const A = S.admin; const q = A.q.toLowerCase();
  const withSt = CLIENTS.map(c => ({ c, st: statusOf(c) }));
  const count = k => withSt.filter(x => x.st.k === k).length;
  const list = withSt.filter(x => (A.filter === 'all' || x.st.k === A.filter) && (!q || (x.c.name + x.c.contact + x.c.code).toLowerCase().includes(q)));
  const caps = CLIENTS.reduce((a, c) => a + c.stats.capsules, 0), posts = CLIENTS.reduce((a, c) => a + c.stats.posts, 0);
  const fl = [['all', 'Tous', CLIENTS.length], ['prep', 'En préparation', count('prep')], ['active', 'Actifs', count('active')], ['soon', 'Expirent bientôt', count('soon')], ['pending', 'Non activés', count('pending')], ['expired', 'Expirés', count('expired')], ['disabled', 'Désactivés', count('disabled')]];
  return `<div class="page-head"><div><h1>Clients</h1><p>Créez les espaces, suivez les accès et l'utilisation de la plateforme.</p></div><button class="btn btn-primary" data-a="new-client">${I('plus')}Nouveau client</button></div>
  <div class="grid g4"><div class="kpi"><span>Espaces actifs</span><b class="num">${count('active') + count('soon')}</b></div><div class="kpi"><span>Expirent sous 7 jours</span><b class="num" style="color:var(--warn)">${count('soon')}</b></div><div class="kpi"><span>Capsules créées</span><b class="num">${caps}</b></div><div class="kpi"><span>Publications générées</span><b class="num">${posts}</b></div></div>
  <div class="row between" style="margin:26px 0 14px"><div class="row" style="gap:6px" role="group" aria-label="Filtrer par statut">${fl.map(([k, l, n]) => `<button class="chip" data-a="a-filter" data-arg="${k}" aria-pressed="${A.filter === k}">${l} <span class="num" style="opacity:.7">${n}</span></button>`).join('')}</div>
    <label class="search">${I('search')}<span class="visually-hidden">Rechercher</span><input data-in="a-q" placeholder="Rechercher un client, un code" value="${esc(A.q)}"></label></div>
  <div class="tbl-wrap"><table><thead><tr><th>Entreprise</th><th>Statut</th><th>Code d'accès</th><th>Activation</th><th>Expiration</th><th>Dernière connexion</th><th>Utilisation</th><th><span class="visually-hidden">Actions</span></th></tr></thead><tbody>
  ${list.map(({ c, st }) => `<tr><td><div class="row" style="flex-wrap:nowrap"><span class="logo-tile" style="background:${c.color};width:32px;height:32px;font-size:12px;border-radius:8px">${initials(c.name)}</span><div><b>${esc(c.name)}</b><div class="small muted">${esc(c.contact)}</div></div></div></td>
    <td><span class="tag ${st.cls}">${st.label}</span></td><td><span class="code-pill num">${S.admin.revealed[c.id] ? c.code : c.code.slice(0, 3) + '••••-••'}</span></td>
    <td class="num">${c.activatedAt ? fmtShort(c.activatedAt) : '<span class="muted">En attente</span>'}</td>
    <td class="num">${c.expiresAt ? fmtShort(c.expiresAt) + (st.k === 'active' || st.k === 'soon' ? `<div class="small muted">${daysLeft(c)} j restants</div>` : '') : '<span class="muted">30 j après activation</span>'}</td>
    <td class="num">${c.lastLogin ? relDay(c.lastLogin) : '<span class="muted">Jamais</span>'}</td>
    <td class="num small">${c.stats.capsules} capsules<br><span class="muted">${c.stats.posts} posts</span></td>
    <td><button class="btn btn-ghost btn-sm" data-a="a-open" data-arg="${c.id}">Gérer</button></td></tr>`).join('') || `<tr><td colspan="8" class="muted" style="text-align:center;padding:30px">Aucun client ne correspond à cette recherche.</td></tr>`}
  </tbody></table></div>`;
}
function relDay(d) { const n = Math.round((TODAY - d) / DAY); return n <= 0 ? "Aujourd'hui" : n === 1 ? 'Hier' : `Il y a ${n} jours`; }

function aStats() {
  const w = ['3 août', '10 août', '17 août', '24 août', '31 août', '7 sept.', '14 sept.', '21 sept.'];
  const d = [[38, 45, 41, 52, 60, 57, 68, 74], [12, 15, 14, 19, 22, 21, 27, 31], [20, 26, 24, 31, 36, 35, 42, 49]];
  const cols = ['var(--ink)', '#9C9CFF', 'var(--text)']; const max = 80; const W = 720, H = 260, pad = 34, gw = (W - pad) / w.length;
  let bars = '';
  w.forEach((lab, i) => { d.forEach((ser, j) => { const h = ser[i] / max * (H - 50); bars += `<rect x="${pad + i * gw + 10 + j * ((gw - 20) / 3)}" y="${H - 28 - h}" width="${(gw - 20) / 3 - 3}" height="${h}" rx="2" fill="${cols[j]}"><title>${lab} : ${ser[i]}</title></rect>`; }); bars += `<text x="${pad + i * gw + gw / 2}" y="${H - 8}" font-size="11" text-anchor="middle" fill="var(--muted)">${lab}</text>`; });
  let grid = ''; [0, 20, 40, 60, 80].forEach(v => { const y = H - 28 - v / max * (H - 50); grid += `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad - 6}" y="${y + 4}" font-size="11" text-anchor="end" fill="var(--muted)">${v}</text>`; });
  const top = [...CLIENTS].sort((a, b) => (b.stats.capsules + b.stats.posts) - (a.stats.capsules + a.stats.posts)).slice(0, 5);
  const act = CLIENTS.filter(c => c.activatedAt).length; const rate = Math.round(CLIENTS.filter(c => c.stats.capsules > 0).length / act * 100);
  return `<div class="page-head"><div><h1>Statistiques d'utilisation</h1><p>Vue d'ensemble de l'activité des espaces clients sur les 8 dernières semaines.</p></div></div>
  <div class="grid g4"><div class="kpi"><span>Connexions (8 sem.)</span><b class="num">${d[0].reduce((a, b) => a + b)}</b></div><div class="kpi"><span>Capsules créées (8 sem.)</span><b class="num">${d[1].reduce((a, b) => a + b)}</b></div><div class="kpi"><span>Publications générées (8 sem.)</span><b class="num">${d[2].reduce((a, b) => a + b)}</b></div><div class="kpi"><span>Clients ayant créé une capsule</span><b class="num">${rate} %</b></div></div>
  <div class="panel" style="margin-top:18px"><div class="row between" style="margin-bottom:10px"><h3>Activité par semaine</h3><div class="legend"><span><i style="background:var(--ink)"></i>Connexions</span><span><i style="background:#9C9CFF"></i>Capsules</span><span><i style="background:var(--text)"></i>Publications</span></div></div>
    <div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" style="min-width:560px" role="img" aria-label="Activité hebdomadaire">${grid}${bars}</svg></div></div>
  <section class="sec"><div class="sec-head"><h2>Clients les plus actifs</h2></div><div class="list">${top.map(c => `<div class="li"><span class="logo-tile" style="background:${c.color};width:36px;height:36px;font-size:12px;border-radius:8px">${initials(c.name)}</span><div class="grow"><b>${esc(c.name)}</b><span class="small muted">${c.stats.logins} connexions, ${c.stats.capsules} capsules, ${c.stats.posts} publications</span></div><button class="btn btn-ghost btn-sm" data-a="a-open" data-arg="${c.id}">Gérer</button></div>`).join('')}</div></section>`;
}

/* ================= Après rendu ================= */
function after() {
  const form = document.getElementById('login-form');
  if (form) {
    const inp = document.getElementById('code');
    if (S.prefill) { inp.value = S.prefill; S.prefill = null; }
    inp.addEventListener('input', () => { const pos = inp.value.length; inp.value = normCode(inp.value); inp.classList.remove('err'); document.getElementById('code-err').textContent = ''; });
    form.addEventListener('submit', e => { e.preventDefault(); doLogin(normCode(inp.value)); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doLogin(normCode(inp.value)); } });
    if (!S.modal) setTimeout(() => inp.focus({ preventScroll: true }), 50);
  }
  const drop = document.getElementById('drop');
  if (drop) {
    ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => addFiles([...e.dataTransfer.files]));
  }
  sizeCapsuleSubs(); if (document.getElementById('vv')) { if (vvRaf) cancelAnimationFrame(vvRaf); vvRaf = requestAnimationFrame(vvTick); } fitMediaRow();
  const spv = document.getElementById('sp-v');
  if (spv) { spLast = -2; spv.addEventListener('loadedmetadata', () => { const first = !SUB.duration; SUB.duration = spv.duration; SUB.w = spv.videoWidth; SUB.h = spv.videoHeight; const mt = document.getElementById('sp-meta'); if (mt) mt.textContent = `${tc(SUB.duration)}, ${SUB.w} × ${SUB.h}`; if (first && SUB.cues.length) { fixSubTiming(); S.keepScroll = true; render(); } }); spv.addEventListener('error', () => { SUB.err = "Cette vidéo ne peut pas être lue ici. Essayez un fichier MP4 (H.264)."; const e = document.getElementById('sp-err'); if (e) e.textContent = SUB.err; }); if (subRaf) cancelAnimationFrame(subRaf); subRaf = requestAnimationFrame(subTick); }
  document.querySelectorAll('[data-in="sp-cue"]').forEach(t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; });
  const jsrc = document.getElementById('t-jsrc');

/* Aperçu animé des capsules */
function playFrame(key) {
  const fr = document.querySelector(`[data-frame="${key}"]`); if (!fr) return;
  if (fr._t) { clearInterval(fr._t); fr._t = null; fr.querySelector('.fplay').innerHTML = IF('play'); return; }
  let cap;
  if (key === 'preview') { const v = video(S.cap.videoId); cap = { lines: v.highlights[0].lines, dur: S.cap.dur }; }
  else if (key === 'edit') cap = S.modal.draft;
  else cap = S.cap.results[+key.slice(1)];
  const style = fr.dataset.style; const sub = fr.querySelector('[data-sub]'); const fp = fr.querySelector('[data-fp]'); const ft = fr.querySelector('[data-ft]');
  const n = Math.max(1, Math.ceil(cap.dur / 10)); const lines = cap.lines.slice(0, n);
  let t = 0; const step = 100, total = cap.dur * 1000 / 4; // aperçu accéléré x4
  fr.querySelector('.fplay').innerHTML = IF('pause');
  fr._t = setInterval(() => {
    t += step; const f = Math.min(1, t / total);
    const li = Math.min(lines.length - 1, Math.floor(f * lines.length));
    sub.innerHTML = subHtml(lines[li], style); fp.style.width = (f * 100) + '%'; ft.textContent = `${tc(f * cap.dur)} / 0:${String(cap.dur).padStart(2, '0')}`;
    if (f >= 1) { clearInterval(fr._t); fr._t = null; fr.querySelector('.fplay').innerHTML = IF('play'); }
  }, step);
  TIMERS.push(fr._t);
}
function playMain() {
  const pl = document.getElementById('player'); if (!pl) return;
  const btn = pl.querySelector('.ctrl button');
  if (pl._t) { clearInterval(pl._t); pl._t = null; btn.innerHTML = IF('play'); btn.setAttribute('aria-label', 'Lire'); return; }
  const v = video(S.arg); const lines = v.highlights.flatMap(h => h.lines.map((l, i) => ({ t: h.start + i * 7, l })));
  pl._pos = pl._pos || 0; btn.innerHTML = IF('pause'); btn.setAttribute('aria-label', 'Pause');
  pl._t = setInterval(() => {
    pl._pos = Math.min(v.duration, pl._pos + 2);
    document.getElementById('pbar').style.width = (pl._pos / v.duration * 100) + '%';
    document.getElementById('ptime').textContent = `${tc(pl._pos)} / ${tc(v.duration)}`;
    const cur = [...lines].reverse().find(x => x.t <= pl._pos) || lines[0];
    document.getElementById('psub').textContent = cur.l.replace(/\*/g, '');
    if (pl._pos >= v.duration) { clearInterval(pl._t); pl._t = null; btn.innerHTML = IF('play'); }
  }, 100);
  TIMERS.push(pl._t);
}

function companyInitials(name, variant) {
  const n = String(name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const STOP = ['de', 'des', 'du', 'la', 'le', 'les', 'et', 'd', 'l', 'au', 'aux', 'en', 'sa', 'sas', 'sarl', 'groupe'];
  const words = n.replace(/[^A-Za-z ]/g, ' ').split(/\s+/).filter(w => w && !STOP.includes(w.toLowerCase()));
  const caps = (n.match(/[A-Z]/g) || []);
  const cands = [];
  if (words.length >= 2) cands.push(words[0][0] + words[1][0]);
  if (caps.length >= 2) cands.push(caps[0] + caps[1]);
  const w0 = (words[0] || 'XX'); cands.push(w0.slice(0, 2));
  const pool = words.join(''); for (let i = 1; i < pool.length; i++) cands.push(w0[0] + pool[i]);
  const uniq = [...new Set(cands.map(x => x.toUpperCase().padEnd(2, 'X')))];
  return uniq[Math.min(variant || 0, uniq.length - 1)];
}
function genCode(name, date, selfId, avoid) {

}

document.addEventListener('change', e => {

  if (k === 'nf' && S.modal && S.modal.f) { S.modal.f[el.dataset.arg] = el.value; if (el.dataset.arg === 'diffusion' || el.dataset.arg === 'media') { S.keepScroll = true; render(); } }
  if (k === 'nf-logo') { const file = el.files && el.files[0]; if (!file) return; const rd = new FileReader(); rd.onload = () => { const img = new Image(); img.onload = () => { const h = Math.min(160, img.height); const w = Math.round(img.width * h / img.height); const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h); S.modal.f.logoFile = file; /* Habillage : original conservé pour l'envoi HD */ S.modal.f.logo = cv.toDataURL('image/png'); S.keepScroll = true; render(); }; img.src = rd.result; }; rd.readAsDataURL(file); }
  if (k === 'av-c' && S.modal && S.modal.f) { S.modal.f[el.dataset.arg] = el.value; }

  if (k === 'av-stills' && S.modal && S.modal.f) { S.modal.f.stills = el.checked; }
  if (k === 'av-files') { const fs = [...(el.files || [])]; if (fs.length) avAddVideos(fs); }
  if (k === 'av-docs') { const fs = [...(el.files || [])]; fs.forEach(file => S.modal.f.docs.push({ key: 'r' + (++rowKey), file, title: file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' '), kind: /\.(jpe?g|png|webp|heic)$/i.test(file.name) ? 'Photos' : 'Article' })); S.keepScroll = true; render(); }
  if (k === 'av-vsrt') { const f = el.files && el.files[0]; if (!f) return; const key = el.dataset.arg; const rd = new FileReader(); rd.onload = () => { const cues = parseSubs(decodeText(rd.result)); if (!cues.length) { toast("Aucun sous-titre horodaté trouvé dans ce fichier"); return; } const r = S.modal.f.vids.find(x => x.key === key); if (!r) return; r.cues = cues; r.srtName = f.name; r.fix = !!shiftCues(cues, r.duration); S.keepScroll = true; render(); }; rd.readAsArrayBuffer(f); }
  if (k === 'av-srt-old') { const f = el.files && el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { const cues = parseSubs(decodeText(rd.result)); if (!cues.length) { toast("Aucun sous-titre horodaté trouvé dans ce fichier"); return; } const mf = S.modal.f; mf.cues = cues; mf.srtName = f.name; mf.fix = !!shiftCues(cues, mf.duration); S.keepScroll = true; render(); }; rd.readAsArrayBuffer(f); }

  if (k === 'm-jingle') { const f = el.files && el.files[0]; if (!f) return; if (f.type && !/^video\//.test(f.type)) { toast('Importez un fichier vidéo (MP4 de préférence).'); return; } uploadJingle(mediaById(S.admin.arg), el.dataset.arg, f); } /* Habillage */

document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) A.close(); });

try { const c1 = CLIENTS.find(c => c.id === 'c1'); if (c1 && !c1.kit) c1.kit = buildKitSync(c1, 'publie'); } catch (e) {}
